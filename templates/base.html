<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chronicle{% endblock %}</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/feed.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="{% block description %}An automated life-archive system{% endblock %}">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/"><span class="logo-icon">&#x25C8;</span> {{ site_title }}</a></h1>
            <nav>
                <a href="/essays/" {% if page == "essays" %}class="active"{% endif %}>Essays</a>
                <a href="/" {% if page == "index" %}class="active"{% endif %}>Live</a>
                <a href="/thoughts/" {% if page == "thoughts" %}class="active"{% endif %}>Mind</a>
                <a href="/input/" {% if page == "input" %}class="active"{% endif %}>Input</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>{{ site_title }} | {{ author }}</p>
            <p>Raw over polished. Exhaust, not effort.</p>
        </div>
    </footer>
</body>
</html>
