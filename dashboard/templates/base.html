<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="{{ REFRESH_INTERVAL }}">
    <title>Chronicle Dashboard{% block title_suffix %}{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e0e0e8;
            line-height: 1.5;
            min-height: 100vh;
        }
        a { color: #7eb8da; text-decoration: none; }
        a:hover { color: #a8d8f0; text-decoration: underline; }

        /* Nav */
        nav {
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a3e;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            gap: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: #7eb8da;
            padding: 0.75rem 1rem 0.75rem 0;
            border-right: 1px solid #2a2a3e;
            margin-right: 0.5rem;
            white-space: nowrap;
        }
        nav a.nav-link {
            padding: 0.75rem 0.8rem;
            color: #8888a0;
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        nav a.nav-link:hover { color: #e0e0e8; text-decoration: none; }
        nav a.nav-link.active {
            color: #e0e0e8;
            border-bottom-color: #7eb8da;
        }
        nav .refresh-indicator {
            margin-left: auto;
            font-size: 0.75rem;
            color: #555;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Cards */
        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6a6a80;
            margin-bottom: 0.75rem;
        }

        /* Grid */
        .grid { display: grid; gap: 1rem; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }

        /* Stat cards */
        .stat { text-align: center; padding: 1rem; }
        .stat .value {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat .label {
            font-size: 0.75rem;
            color: #6a6a80;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat .sub {
            font-size: 0.75rem;
            color: #555;
            margin-top: 0.25rem;
        }

        /* Source badges */
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-mind { background: #1a3a5c; color: #7eb8da; }
        .badge-sprout { background: #1a4a2e; color: #7eda8e; }
        .badge-qwen { background: #4a3a1a; color: #dab87e; }
        .badge-operator { background: #4a1a3a; color: #da7eb8; }
        .badge-system { background: #2a2a3e; color: #8888a0; }

        /* Activity items */
        .activity-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-item .meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .activity-item .time {
            font-size: 0.75rem;
            color: #555;
        }
        .activity-item .type {
            font-size: 0.75rem;
            color: #6a6a80;
        }
        .activity-item .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .activity-item .content {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.25rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Thought cards */
        .thought-card {
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: #12121f;
            border-radius: 6px;
            border-left: 3px solid #2a2a3e;
        }
        .thought-card .cycle {
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 0.5rem;
        }
        .thought-card .reasoning {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.8rem;
            color: #bbb;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
        }
        .thought-card .actions-taken {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .action-tag {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            background: #1a2a3a;
            border-radius: 3px;
            font-size: 0.7rem;
            color: #7eb8da;
        }

        /* Creative */
        .creative-piece {
            background: #12121f;
            border-radius: 6px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-left: 3px solid #4a3a6a;
        }
        .creative-piece .form-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            background: #2a1a3a;
            color: #b87eda;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .creative-piece .body {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* Notes */
        .note-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }
        .note-item .pri {
            font-weight: 700;
            font-size: 0.75rem;
            min-width: 2rem;
            text-align: center;
            padding: 0.15rem 0;
            border-radius: 3px;
        }
        .pri-high { background: #4a1a1a; color: #da7e7e; }
        .pri-med { background: #4a3a1a; color: #dab87e; }
        .pri-low { background: #1a2a1a; color: #7eda7e; }
        .note-item .cat {
            font-size: 0.7rem;
            color: #6a6a80;
            text-transform: uppercase;
            min-width: 5rem;
        }
        .note-item .text {
            font-size: 0.85rem;
            flex: 1;
            word-break: break-word;
        }

        /* Wallet */
        .prediction-row {
            padding: 0.5rem 0;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .win { color: #7eda7e; }
        .loss { color: #da7e7e; }
        .pending-pred { color: #dab87e; }

        /* Pagination */
        .pagination {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .pagination a, .pagination span {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .pagination a { background: #1a1a2e; }
        .pagination span.current { background: #2a3a5c; color: #7eb8da; }

        /* Filter tabs */
        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1rem;
        }
        .tabs a {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #8888a0;
            background: #1a1a2e;
        }
        .tabs a.active { background: #2a3a5c; color: #7eb8da; }
        .tabs a:hover { text-decoration: none; color: #e0e0e8; }

        /* Utility */
        .text-dim { color: #555; }
        .text-green { color: #7eda7e; }
        .text-red { color: #da7e7e; }
        .text-blue { color: #7eb8da; }
        .text-orange { color: #dab87e; }
        .text-purple { color: #b87eda; }
        .mono {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
        }
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mt-1 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Chronicle</span>
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Overview</a>
        <a href="/stream" class="nav-link {% if '/stream' in request.path %}active{% endif %}">Stream</a>
        <a href="/thoughts" class="nav-link {% if '/thoughts' in request.path %}active{% endif %}">Thoughts</a>
        <a href="/creative" class="nav-link {% if '/creative' in request.path %}active{% endif %}">Creative</a>
        <a href="/wallet" class="nav-link {% if '/wallet' in request.path %}active{% endif %}">Wallet</a>
        <a href="/notes" class="nav-link {% if '/notes' in request.path %}active{% endif %}">Notes</a>
        <a href="/projects" class="nav-link {% if '/projects' in request.path %}active{% endif %}">Projects</a>
        <span class="refresh-indicator">auto-refresh {{ REFRESH_INTERVAL }}s</span>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
