<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Chat</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-hover: #1c2129;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --nate: #58a6ff;
  --opus: #d2a8ff;
  --darby: #7ee787;
  --ada: #ffa657;
  --input-bg: #0d1117;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  flex: 1;
}

.status-dots {
  display: flex;
  gap: 8px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  position: relative;
}

.status-dot.online { background: #3fb950; }
.status-dot::after {
  content: attr(data-name);
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.message {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 12px;
  line-height: 1.5;
  font-size: 14px;
  word-wrap: break-word;
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.message .sender {
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.message.nate {
  align-self: flex-end;
  background: #1f3a5f;
  border-bottom-right-radius: 4px;
}
.message.nate .sender { color: var(--nate); }

.message.opus {
  align-self: flex-start;
  background: #2d1f4e;
  border-bottom-left-radius: 4px;
}
.message.opus .sender { color: var(--opus); }

.message.darby {
  align-self: flex-start;
  background: #1a3328;
  border-bottom-left-radius: 4px;
}
.message.darby .sender { color: var(--darby); }

.message.ada {
  align-self: flex-start;
  background: #3d2a1a;
  border-bottom-left-radius: 4px;
}
.message.ada .sender { color: var(--ada); }

.message .content {
  white-space: pre-wrap;
}

.typing-indicator {
  align-self: flex-start;
  padding: 8px 12px;
  color: var(--text-muted);
  font-size: 13px;
  font-style: italic;
  display: none;
}

.typing-indicator.visible { display: block; }

#input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

#message-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.4;
}

#message-input:focus {
  border-color: var(--nate);
}

#message-input::placeholder {
  color: var(--text-muted);
}

#send-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 20px;
  background: var(--nate);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.15s;
}

#send-btn:hover { opacity: 0.9; }
#send-btn:disabled { opacity: 0.4; cursor: default; }

/* Mobile adjustments */
@media (max-width: 600px) {
  .message { max-width: 90%; }
  header { padding: 10px 12px; }
  #input-area { padding: 8px 12px; }
}

/* Scrollbar */
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Family Chat</h1>
  <div class="status-dots">
    <div class="status-dot online" data-name="Opus"></div>
    <div class="status-dot online" data-name="Darby"></div>
    <div class="status-dot online" data-name="Ada"></div>
  </div>
</header>

<div id="messages"></div>

<div class="typing-indicator" id="typing">Someone is thinking...</div>

<div id="input-area">
  <textarea id="message-input" placeholder="Say something..." rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const typingIndicator = document.getElementById('typing');

let lastMessageId = 0;
let polling = null;
let waitingForResponses = false;

function formatTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function addMessage(msg) {
  const div = document.createElement('div');
  const senderClass = msg.sender.toLowerCase();
  div.className = `message ${senderClass}`;
  div.dataset.id = msg.id;

  div.innerHTML = `
    <div class="sender">${msg.sender}</div>
    <div class="content">${escapeHtml(msg.content)}</div>
  `;

  messagesDiv.appendChild(div);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function loadMessages() {
  try {
    const url = lastMessageId > 0
      ? `/api/messages?since=${lastMessageId}`
      : '/api/messages';
    const res = await fetch(url);
    const messages = await res.json();

    if (messages.length > 0) {
      messages.forEach(msg => {
        if (msg.id > lastMessageId) {
          addMessage(msg);
          lastMessageId = msg.id;
        }
      });
      scrollToBottom();

      // Check if we got AI responses
      if (waitingForResponses) {
        const aiMessages = messages.filter(m => m.sender !== 'Nate');
        if (aiMessages.length > 0) {
          // Keep polling a bit longer for remaining responses
          setTimeout(() => {
            waitingForResponses = false;
            typingIndicator.classList.remove('visible');
          }, 8000);
        }
      }
    }
  } catch (e) {
    console.error('Poll error:', e);
  }
}

async function sendMessage() {
  const content = input.value.trim();
  if (!content) return;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });

    if (res.ok) {
      waitingForResponses = true;
      typingIndicator.classList.add('visible');

      // Start faster polling while waiting for responses
      if (polling) clearInterval(polling);
      polling = setInterval(loadMessages, 1000);

      // Return to normal polling after 30s
      setTimeout(() => {
        if (polling) clearInterval(polling);
        polling = setInterval(loadMessages, 3000);
        waitingForResponses = false;
        typingIndicator.classList.remove('visible');
      }, 30000);
    }
  } catch (e) {
    console.error('Send error:', e);
  }

  sendBtn.disabled = false;
  input.focus();
}

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Send on Enter (Shift+Enter for newline)
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// Initial load + polling
loadMessages();
polling = setInterval(loadMessages, 3000);

// Focus input on load
input.focus();
</script>

</body>
</html>
